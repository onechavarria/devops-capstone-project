apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir flake8==6.1.0
        python -m compileall -q service tests
        flake8 service tests --max-line-length=127 --count --statistics
        echo "Flake8 completed successfully"
